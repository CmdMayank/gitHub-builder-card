<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub Builder Card</title>
  <link rel="stylesheet" href="style.css">

  
  <script>
    (function () {
      let theme = null;
      try { theme = localStorage.getItem("theme"); } catch (e) {}
      if (!theme) {
        theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
</head>
<body>
  <header class="navbar">
    <div class="navbar-inner">
      <h1 class="brand"><a href="./">GitHub Builder Card</a></h1>

      <nav class="nav-links" aria-label="Site">
        <!-- TODO: replace with your own profile links -->
        <a href="https://www.linkedin.com/in/sharmamayankk/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        <a href="https://github.com/CmdMayank" target="_blank" rel="noopener noreferrer">GitHub</a>
        <button id="theme-toggle" class="theme-toggle" type="button">Dark mode</button>
      </nav>
    </div>
  </header>

  <main class="page">
    <p class="intro">Enter a GitHub username to see their top repos, main languages and recent activity.</p>

    <form id="search-form" class="search">
      <label for="username" class="visually-hidden">GitHub username</label>
      <input id="username" type="text" placeholder="e.g. torvalds" autocomplete="off" required>
      <button type="submit">Build card</button>
    </form>

   
    <p id="status" role="status" aria-live="polite"></p>

    
    <article id="card" class="card" hidden>
      <section id="profile" class="profile"></section>

      <section>
        <h2>Top repos</h2>
        <div id="repos" class="repos"></div>
      </section>

      <section>
        <h2>Main languages</h2>
        <div id="languages"></div>
      </section>

      <section>
        <h2>Recent activity</h2>
        <ul id="activity" class="activity"></ul>
      </section>
    </article>
  </main>

  <script src="app.js"></script>
</body>
</html>
